 "#dbd7cf", "on-error": "#ffffff", "primary-fixed-dim": "#8ecf9e" }, borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" }, spacing: {}, fontFamily: { "headline": ["Literata"], "display": ["Literata"], "body": ["Nunito Sans"], "label": ["Nunito Sans"] }, fontSize: {} } } };</script></head><body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-6 py-6"><div class="flex flex-col w-full space-y-6"><!-- Encabezado / Logo LinceOPS -->

</div>
</div>
<!-- Selector de Rol Ultra Simple (Pills / Grid Compacto) -->
<!-- Formulario Minimalista -->
<div class="space-y-1.5"></div><div class="space-y-4 pt-1">
<div class="space-y-1.5">
<label class="block text-xs font-bold uppercase tracking-wider text-secondary" for="input-rut">RUT o Usuario</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-lg pointer-events-none">badge</span>

</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-lg pointer-events-none">lock</span>
<input class="w-full bg-surface-container pl-10 pr-11 py-3 rounded-xl text-sm font-medium text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-high transition-colors" id="input-pin" placeholder="••••••••" type="password" value="Patagonia2025">
<button class="absolute right-3 text-secondary hover:text-on-surface focus:outline-none p-1 flex items-center justify-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-lg" id="pw-toggle-icon">visibility</span>
</button>
</div>
</div>
</div>
<!-- Botones de Acción Limpios -->
<div class="space-y-3 pt-2">
<button class="w-full py-3.5 px-5 rounded-xl font-bold text-sm bg-primary text-on-primary flex items-center justify-center space-x-2 shadow-sm hover:opacity-95 active:scale-[0.99] transition-all" onclick="handleLoginSubmit()" type="button">
<span class="material-symbols-outlined text-lg">login</span>
<span class="">Iniciar Sesión</span>
</button>
<button class="w-full py-3 px-4 rounded-xl font-semibold text-xs bg-surface-container text-on-surface flex items-center justify-center space-x-2 hover:bg-surface-container-high active:scale-[0.99] transition-all" onclick="triggerBiometrics()" type="button">
<span class="material-symbols-outlined text-base text-primary">fingerprint</span>
<span class="">Ingreso con Biometría (Face ID / Huella)</span>
</button>
</div>
<!-- Footer Limpio y Sutil -->
<div class="text-center pt-4 pb-2 space-y-2">
<a class="text-xs font-medium text-secondary hover:text-primary hover:underline transition-colors block" href="#">
    ¿Necesitas ayuda? Contactar Soporte
  </a>
<p class="text-[11px] text-outline tracking-wide">LINCE OPS Mobile</p>
</div></div>
<script>
  let selectedRoleState = 'driver';

  function selectRole(roleKey) {
    selectedRoleState = roleKey;
    const roles = ['driver', 'guide', 'manager'];
    
    roles.forEach((r) => {
      const card = document.getElementById(`role-card-${r}`);
      const badge = document.getElementById(`badge-${r}`);
      const radioIcon = card.querySelector('.radio-icon');
      const iconBox = card.querySelector('.role-icon-box');

      if (r === roleKey) {
        card.classList.remove('bg-surface-container');
        card.classList.add('bg-surface-container-high', 'shadow');
        badge.classList.remove('hidden');
        radioIcon.textContent = 'radio_button_checked';
        radioIcon.classList.add('text-primary');
        radioIcon.classList.remove('text-outline');
        iconBox.classList.add('bg-primary-container', 'text-on-primary-container');
      } else {
        card.classList.add('bg-surface-container');
        card.classList.remove('bg-surface-container-high', 'shadow');
        badge.classList.add('hidden');
        radioIcon.textContent = 'radio_button_unchecked';
        radioIcon.classList.remove('text-primary');
        radioIcon.classList.add('text-outline');
        iconBox.classList.remove('bg-primary-container', 'text-on-primary-container');
      }
    });
  }

  function togglePasswordVisibility() {
    const pinInput = document.getElementById('input-pin');
    const toggleIcon = document.getElementById('pw-toggle-icon');
    if (pinInput.type === 'password') {
      pinInput.type = 'text';
      toggleIcon.textContent = 'visibility_off';
    } else {
      pinInput.type = 'password';
      toggleIcon.textContent = 'visibility';
    }
  }

  function handleLoginSubmit() {
    const roleLabels = {
      driver: 'Conductor (Driver)',
      guide: 'Guía de Turismo',
      manager: 'Manager de Operaciones'
    };
    const rutVal = document.getElementById('input-rut').value || '16.482.990-4';
    const baseVal = document.getElementById('base-selector').selectedOptions[0].text;
    
    const btn = event.currentTarget;
    const originalContent = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-lg">sync</span><span>Sincronizando Turno...</span>`;
    btn.disabled = true;

    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-lg">check_circle</span><span>Acceso Concedido</span>`;
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-primary-container', 'text-on-primary-fixed');
      setTimeout(() => {
        btn.innerHTML = originalContent;
        btn.disabled = false;
        btn.classList.add('bg-primary');
        btn.classList.remove('bg-primary-container', 'text-on-primary-fixed');
      }, 2000);
    }, 1100);
  }

  function triggerBiometrics() {
    const btn = event.currentTarget;
    const originalText = btn.innerHTML;
    btn.innerHTML = `<span class="material-symbols-outlined text-base text-primary animate-pulse">fingerprint</span><span class="text-xs font-bold text-primary">Validando sensor biométrico...</span>`;
    setTimeout(() => {
      btn.innerHTML = originalText;
      handleLoginSubmit();
    }, 850);
  }

  // Set initial selected state on load
  selectRole('driver');
</script></main>


</body></html>
