spring.application.name=apiLince

# ===============================
# JWT CONFIGURATION
# ===============================
# Usamos una variable de entorno, y si no existe, usa la de evaluación por defecto
app.jwt.secret=${JWT_SECRET:LinceOps_Super_Secret_Key_Para_Evaluacion_EA5_DuocUC_2026}
app.jwt.expiration-milliseconds=8640000

# ===============================
# DATASOURCE (Supabase / PostgreSQL)
# ===============================
# Ocultamos el usuario y contraseña con variables de entorno
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?user=${DB_USER}&password=${DB_PASSWORD}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === SOLUCIÓN SUPABASE POOLER ===
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false